server {
    listen 80;
    listen [::]:80;
    server_name cointent.enjoyapier.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cointent.enjoyapier.cloud;

    ssl_certificate /etc/letsencrypt/live/cointent.enjoyapier.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cointent.enjoyapier.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/cointent;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8811;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/ {
        proxy_pass http://127.0.0.1:8811;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://127.0.0.1:8811;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Dashboard is served by the backend so its pinned build, CSP and browser
    # session checks stay in one release unit with the UA validator.
    location ^~ /ua-viewer {
        proxy_pass http://127.0.0.1:8811;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Narrow data plane for authenticated viewer reads and refresh-scoped bearer
    # uploads/downloads. The backend still enforces token, lease, digest and size.
    location ^~ /internal/ {
        client_max_body_size 1024m;
        client_body_timeout 900s;
        proxy_pass http://127.0.0.1:8811;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
